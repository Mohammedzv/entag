<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>EBM Production System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">EBM</div>
      <p class="eyebrow">PRODUCTION & MAINTENANCE</p>
      <h1>نظام إدارة الإنتاج</h1>
      <p class="muted">سجّل الدخول للمتابعة</p>
      <form id="loginForm">
        <label>البريد الإلكتروني<input id="loginEmail" type="email" autocomplete="username" required placeholder="name@company.com"></label>
        <label>كلمة المرور<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
        <button class="btn primary full" type="submit">تسجيل الدخول</button>
        <p id="loginError" class="error"></p>
      </form>
      <p class="small muted">الحسابات ينشئها مسؤول النظام من Firebase Authentication.</p>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand"><span class="brand-mark small-mark">EBM</span><div><b>EBM System</b><small>Production Control</small></div></div>
      <div class="user-mini"><div class="avatar" id="avatar">E</div><div><b id="userName">المستخدم</b><small id="userRole">—</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard" data-permission="dashboard">▦ <span>لوحة التحكم</span></button>
        <button class="nav-item" data-page="production" data-permission="production.view">▤ <span>تسجيل الإنتاج</span></button>
        <button class="nav-item" data-page="lines" data-permission="lines.manage">☷ <span>خطوط الإنتاج</span></button>
        <button class="nav-item" data-page="maintenance" data-permission="maintenance.view">⚙ <span>صيانة الماكينات</span><i id="openIssueCount" class="nav-count hidden">0</i></button>
        <button class="nav-item" data-page="reports" data-permission="reports.view">▥ <span>التقارير</span></button>
        <button class="nav-item" data-page="users" data-permission="users.manage">♙ <span>المستخدمون والصلاحيات</span></button>
      </nav>
      <div class="side-bottom"><div class="connection"><span class="live-dot"></span> اتصال مباشر بقاعدة البيانات</div><button id="logoutBtn" class="nav-item logout">↪ <span>تسجيل الخروج</span></button></div>
    </aside>
    <main class="main">
      <header class="topbar"><button id="menuBtn" class="icon-btn" aria-label="القائمة">☰</button><div><p class="eyebrow">EBM / WORKSPACE</p><h2 id="pageTitle">لوحة التحكم</h2></div><div class="top-actions"><span id="todayLabel" class="date-pill"></span><span class="online-pill"><i></i> مباشر</span></div></header>
      <section id="pageContent" class="content"></section>
      <footer>EBM Production System <span>•</span> نظام الإنتاج والصيانة</footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
